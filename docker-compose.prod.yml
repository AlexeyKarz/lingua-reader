services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mlr}
      POSTGRES_USER: ${POSTGRES_USER:-mlr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    image: multilang-reader-mono:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - postgres
    expose:
      - "8080"
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseContainerSupport -XX:InitialRAMPercentage=25.0 -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-mlr}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-mlr}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TRANSLATE_PROVIDER: ${TRANSLATE_PROVIDER:-stub}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_LITERARY_MODEL: ${OPENAI_LITERARY_MODEL:-gpt-4o-mini}
      OPENAI_MAX_COMPLETION_TOKENS: ${OPENAI_MAX_COMPLETION_TOKENS:-300}
      OPENAI_LITERARY_MAX_COMPLETION_TOKENS: ${OPENAI_LITERARY_MAX_COMPLETION_TOKENS:-700}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GOOGLE_LITERARY_MODEL: ${GOOGLE_LITERARY_MODEL:-gemini-2.5-flash}
      GOOGLE_MAX_OUTPUT_TOKENS: ${GOOGLE_MAX_OUTPUT_TOKENS:-512}
      GOOGLE_LITERARY_MAX_OUTPUT_TOKENS: ${GOOGLE_LITERARY_MAX_OUTPUT_TOKENS:-1024}
      TZ: ${TZ:-UTC}
      TRANSLATE_LIMITS_ENABLED: ${TRANSLATE_LIMITS_ENABLED:-true}
      TRANSLATE_LIMITS_PER_IP_DAILY: ${TRANSLATE_LIMITS_PER_IP_DAILY:-10}
      TRANSLATE_LIMITS_GLOBAL_DAILY: ${TRANSLATE_LIMITS_GLOBAL_DAILY:-100}
      TRANSLATE_LIMITS_MAX_TEXT_CHARS: ${TRANSLATE_LIMITS_MAX_TEXT_CHARS:-800}
      TRANSLATE_LIMITS_LITERARY_PER_IP_DAILY: ${TRANSLATE_LIMITS_LITERARY_PER_IP_DAILY:-5}
      TRANSLATE_LIMITS_LITERARY_GLOBAL_DAILY: ${TRANSLATE_LIMITS_LITERARY_GLOBAL_DAILY:-50}
      TRANSLATE_LIMITS_LITERARY_MAX_TEXT_CHARS: ${TRANSLATE_LIMITS_LITERARY_MAX_TEXT_CHARS:-2000}
      MLR_ADMIN_ENABLED: ${MLR_ADMIN_ENABLED:-false}
      MLR_ADMIN_TOKEN: ${MLR_ADMIN_TOKEN:-}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info}

  web:
    build: ./web-ui
    image: multilang-reader-web:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${WEB_PORT:-8080}:80"

  ingest-runner:
    profiles:
      - ingest
    build:
      context: ./python-embed
    image: multilang-reader-ingest:${APP_IMAGE_TAG:-latest}
    depends_on:
      - app
      - postgres
    environment:
      MLR_API_BASE_URL: http://app:8080
      MLR_ADMIN_API_TOKEN: ${MLR_ADMIN_API_TOKEN:-}
      MLR_ADMIN_TOKEN: ${MLR_ADMIN_TOKEN:-}
      DATABASE_URL: host=postgres port=5432 dbname=${POSTGRES_DB:-mlr} user=${POSTGRES_USER:-mlr} password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DICTIONARY_DIR: /dictionaries
      INGESTION_DIR: /ingestion
      HF_HOME: /models/huggingface
      SENTENCE_TRANSFORMERS_HOME: /models/sentence-transformers
    volumes:
      - ingest_model_cache:/models
      - ${DICTIONARY_DIR:-./dictionaries}:/dictionaries:ro
      - ${INGESTION_MANIFEST_DIR:-./ops/ingestion}:/ingestion:ro

volumes:
  postgres_data:
  ingest_model_cache:
