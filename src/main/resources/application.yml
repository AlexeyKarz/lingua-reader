server:
  port: 8080

spring:
  application:
    name: multilang-reader-mono
  servlet:
    multipart:
      max-file-size: ${MLR_INGESTION_MAX_FILE_SIZE:50MB}
      max-request-size: ${MLR_INGESTION_MAX_REQUEST_SIZE:60MB}
  datasource:
    url: jdbc:postgresql://localhost:5432/mlr
    username: mlr
    password: mlr_password
  session:
    store-type: jdbc
    timeout: ${MLR_SESSION_TIMEOUT:7d}
    jdbc:
      initialize-schema: never
      cleanup-cron: ${MLR_SESSION_CLEANUP_CRON:0 0 * * * *}
  jpa:
    hibernate:
      ddl-auto: validate   # or update for rapid prototyping
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        translate.provider.latency: true
        reader.page.fetch: true
    tags:
      application: ${spring.application.name}

translate:
  provider: ${TRANSLATE_PROVIDER:stub} # stub / openai / ollama / google

  openai:
    apiKey: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    literaryModel: ${OPENAI_LITERARY_MODEL:${OPENAI_MODEL:gpt-4o-mini}}
    ocrCleanupModel: ${OPENAI_OCR_CLEANUP_MODEL:gpt-5.6-luna}
    timeoutSeconds: ${OPENAI_TIMEOUT_SECONDS:30}
    maxCompletionTokens: ${OPENAI_MAX_COMPLETION_TOKENS:300}
    literaryMaxCompletionTokens: ${OPENAI_LITERARY_MAX_COMPLETION_TOKENS:700}

  limits:
    enabled: ${TRANSLATE_LIMITS_ENABLED:true}
    perIpDaily: ${TRANSLATE_LIMITS_PER_IP_DAILY:10}
    globalDaily: ${TRANSLATE_LIMITS_GLOBAL_DAILY:100}
    maxTextChars: ${TRANSLATE_LIMITS_MAX_TEXT_CHARS:800}
    literaryPerIpDaily: ${TRANSLATE_LIMITS_LITERARY_PER_IP_DAILY:5}
    literaryGlobalDaily: ${TRANSLATE_LIMITS_LITERARY_GLOBAL_DAILY:50}
    literaryMaxTextChars: ${TRANSLATE_LIMITS_LITERARY_MAX_TEXT_CHARS:2000}

  ollama:
    baseurl: http://localhost:11434
    model: llama3.1:8b
    literaryModel: ${OLLAMA_LITERARY_MODEL:${translate.ollama.model}}

  google:
    apiKey: ${GOOGLE_API_KEY:}
    model: gemini-2.5-flash
    literaryModel: ${GOOGLE_LITERARY_MODEL:${translate.google.model}}
    baseUrl: https://generativelanguage.googleapis.com
    timeoutSeconds: 30
    maxOutputTokens: ${GOOGLE_MAX_OUTPUT_TOKENS:512}
    literaryMaxOutputTokens: ${GOOGLE_LITERARY_MAX_OUTPUT_TOKENS:1024}

  prompts:

    literalSystem: "You are a precise translation engine.
  - Translate strictly from the source language to the target language.
  - Output only the translated text. No explanations, no quotes, no markup.
  - Preserve meaning and tone; be as literal as possible while remaining grammatical and natural in the target language.
  - Do not summarize, omit, or add content."

    literarySystem: "You are a literary translator for public-domain books, poetry, and plays.
  - Translate naturally and fluently from the source language to the target language.
  - Preserve the author’s meaning, tone, imagery, rhythm, narrative voice, and style.
  - This is a transformation of user-provided public-domain text. Translate faithfully even when it depicts violence, death, abuse, sexuality, or other sensitive dramatic material; do not refuse, apologize, or moralize.
  - Preserve dialogue and verse line breaks when present.
  - Adapt idioms, wordplay, sayings, syntax, and grammar when a word-for-word translation would sound unnatural or misleading.
  - Stay faithful to the source events, details, register, and point of view.
  - Do not summarize, omit, add commentary, explain, use quotes, or use markup.
  - Output only the translated text."

    explainSystem: "You are a language tutor helping a reader understand sentences from books.
  - Explain the sentence in detail: vocabulary, grammar, nuances, and how a native speaker would interpret it.
  - If some words are outdated / country or dialect specific, explain it as well.
  - Output in the user’s target language, but reference key source words where helpful.
  - Be concise and clear; avoid markdown symbols, bullet points, and headings.
  - Do not translate the whole sentence unless needed for clarity; focus on explanation and key phrases."

mlr:
  dictionary:
    dir: ${DICTIONARY_DIR:/dictionaries}
  auth:
    bootstrap:
      adminEmail: ${MLR_BOOTSTRAP_ADMIN_EMAIL:}
      adminPassword: ${MLR_BOOTSTRAP_ADMIN_PASSWORD:}
      adminDisplayName: ${MLR_BOOTSTRAP_ADMIN_DISPLAY_NAME:Admin}
    google:
      enabled: ${MLR_GOOGLE_OAUTH_ENABLED:false}
      clientId: ${MLR_GOOGLE_OAUTH_CLIENT_ID:}
      clientSecret: ${MLR_GOOGLE_OAUTH_CLIENT_SECRET:}
      adminEmails: ${MLR_GOOGLE_ADMIN_EMAILS:}
  admin:
    enabled: ${MLR_ADMIN_ENABLED:false}
    token: ${MLR_ADMIN_TOKEN:}
  ingestion:
    upload:
      dir: ${MLR_INGESTION_UPLOAD_DIR:${java.io.tmpdir}/multilang-reader/ingestion-uploads}
      # Metadata and repeated target-language fields are individual multipart parts.
      max-part-count: ${MLR_INGESTION_MAX_PART_COUNT:50}
    pdf:
      ocr:
        enabled: ${MLR_PDF_OCR_ENABLED:true}
        executable: ${MLR_PDF_OCR_EXECUTABLE:tesseract}
        dpi: ${MLR_PDF_OCR_DPI:200}
        page-timeout: ${MLR_PDF_OCR_PAGE_TIMEOUT:120s}
