server:
  port: 8080

spring:
  application:
    name: multilang-reader-mono
  datasource:
    url: jdbc:postgresql://localhost:5432/mlr
    username: mlr
    password: mlr_password
  jpa:
    hibernate:
      ddl-auto: validate   # or update for rapid prototyping
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}

translate:
  provider: openai # stub / openai / ollama

  openai:
    enabled: true   # set to true in prod or in a local override
    apiKey: ${OPENAI_API_KEY:}
    model: gpt-4o-mini

  ollama:
    baseurl: http://localhost:11434
    model: llama3.1:8b