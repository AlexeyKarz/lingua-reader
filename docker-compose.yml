services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: multilang-reader-postgres
    profiles: ["db"]
    environment:
      - POSTGRES_DB=mlr
      - POSTGRES_USER=mlr
      - POSTGRES_PASSWORD=mlr_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: multilang-reader-mono
    image: multilang-reader-mono:dev
    ports:
      - "8080:8080"
    environment:
      - JAVA_TOOL_OPTIONS=-XX:+UseContainerSupport -XX:InitialRAMPercentage=25.0 -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${DB_HOST:-host.docker.internal}:${DB_PORT:-5432}/${DB_NAME:-mlr}
      - SPRING_DATASOURCE_USERNAME=${DB_USER:-mlr}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-mlr_password}
      - TRANSLATE_PROVIDER=${TRANSLATE_PROVIDER:-stub}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_MAX_COMPLETION_TOKENS=${OPENAI_MAX_COMPLETION_TOKENS:-300}
      - OPENAI_TIMEOUT_SECONDS=${OPENAI_TIMEOUT_SECONDS:-30}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - TZ=${TZ:-UTC}
      - TRANSLATE_LIMITS_ENABLED=${TRANSLATE_LIMITS_ENABLED:-true}
      - TRANSLATE_LIMITS_PER_IP_DAILY=${TRANSLATE_LIMITS_PER_IP_DAILY:-20}
      - TRANSLATE_LIMITS_GLOBAL_DAILY=${TRANSLATE_LIMITS_GLOBAL_DAILY:-200}
      - TRANSLATE_LIMITS_MAX_TEXT_CHARS=${TRANSLATE_LIMITS_MAX_TEXT_CHARS:-800}
      - MLR_ADMIN_ENABLED=${MLR_ADMIN_ENABLED:-false}
      - MLR_ADMIN_TOKEN=${MLR_ADMIN_TOKEN:-}
      - MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:-health,info}

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
