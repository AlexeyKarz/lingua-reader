name: Deploy

on:
  push:
    branches:
      - main
      - prod
  pull_request:
    branches:
      - main
      - prod
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check ingestion helper scripts
        run: |
          python -m py_compile \
            python-embed/add_book.py \
            python-embed/add_books_from_manifest.py \
            python-embed/import_dictionary.py
          python python-embed/add_books_from_manifest.py ops/ingestion/books.example.json --dry-run
          python python-embed/add_books_from_manifest.py ops/ingestion/books.generated.example.json --dry-run
          bash -n \
            scripts/ingest-prod.sh \
            scripts/ingest-manifest-prod.sh \
            scripts/import-dictionary-prod.sh

      - name: Run backend tests
        env:
          TRANSLATE_PROVIDER: stub
        run: ./gradlew test

      - name: Install frontend dependencies
        working-directory: web-ui
        run: npm ci

      - name: Lint frontend
        working-directory: web-ui
        run: npm run lint

      - name: Test frontend
        working-directory: web-ui
        run: npm run test:unit

      - name: Build frontend
        working-directory: web-ui
        run: npm run build

      - name: Install Playwright browser
        working-directory: web-ui
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        working-directory: web-ui
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            web-ui/playwright-report/
            web-ui/test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL || 'http://127.0.0.1:8081/api/catalog/books' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' \
              && git fetch --prune origin \
              && git checkout '$DEPLOY_BRANCH' \
              && git reset --hard 'origin/$DEPLOY_BRANCH' \
              && chmod +x scripts/deploy-prod.sh \
              && HEALTHCHECK_URL='$HEALTHCHECK_URL' scripts/deploy-prod.sh"

      - name: Smoke test public deployment
        env:
          PUBLIC_HEALTHCHECK_URL: ${{ vars.PUBLIC_HEALTHCHECK_URL || 'https://reader.alexeykarz.com/api/catalog/books' }}
        run: |
          echo "Checking public deployment: $PUBLIC_HEALTHCHECK_URL"
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error --max-time 10 "$PUBLIC_HEALTHCHECK_URL" >/tmp/public-healthcheck.json; then
              bytes=$(wc -c < /tmp/public-healthcheck.json)
              echo "Public healthcheck passed on attempt $attempt/12 (${bytes} bytes)"
              exit 0
            fi

            if [ "$attempt" -eq 12 ]; then
              echo "::error::Public healthcheck failed after $attempt attempts"
              exit 1
            fi

            echo "Public healthcheck attempt $attempt/12 failed; retrying in 10s"
            sleep 10
          done
