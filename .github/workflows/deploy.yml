name: Deploy

on:
  push:
    branches:
      - main
      - prod
  pull_request:
    branches:
      - main
      - prod
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: mlr
          POSTGRES_USER: mlr
          POSTGRES_PASSWORD: mlr_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mlr -d mlr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "23"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-ui/package-lock.json

      - name: Run backend tests
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/mlr
          SPRING_DATASOURCE_USERNAME: mlr
          SPRING_DATASOURCE_PASSWORD: mlr_password
          TRANSLATE_PROVIDER: stub
        run: ./gradlew test

      - name: Install frontend dependencies
        working-directory: web-ui
        run: npm ci

      - name: Lint frontend
        working-directory: web-ui
        run: npm run lint

      - name: Test frontend
        working-directory: web-ui
        run: npm run test:unit

      - name: Build frontend
        working-directory: web-ui
        run: npm run build

      - name: Install Playwright browser
        working-directory: web-ui
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        working-directory: web-ui
        run: npm run test:e2e

  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request'
    environment: production
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$DEPLOY_PORT" -H "$DEPLOY_HOST" > ~/.ssh/known_hosts
          fi

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          HEALTHCHECK_URL: ${{ secrets.DEPLOY_HEALTHCHECK_URL || 'http://127.0.0.1:8081/api/catalog/books' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' \
              && git fetch --prune origin \
              && git checkout '$DEPLOY_BRANCH' \
              && git reset --hard 'origin/$DEPLOY_BRANCH' \
              && chmod +x scripts/deploy-prod.sh \
              && HEALTHCHECK_URL='$HEALTHCHECK_URL' scripts/deploy-prod.sh"
